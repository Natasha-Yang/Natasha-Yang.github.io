---
layout: default
---
<section class="hero">
  <img class="portrait" src="{{ page.photo | relative_url }}" alt="Portrait of {{ site.title }}">
  <div class="intro">
    <p class="eyebrow">{{ page.title }}</p>
    <h1 class="hero-name">{{ site.title }}</h1>
    {{ content }}
    {% if page.interests %}
      <ul class="tags">
        {% for tag in page.interests %}<li>{{ tag }}</li>{% endfor %}
      </ul>
    {% endif %}
  </div>
</section>
